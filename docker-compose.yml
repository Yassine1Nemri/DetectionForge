name: detectionforge
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-detectionforge}
      POSTGRES_USER: ${POSTGRES_USER:-detectionforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 384m
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Separate connection arguments avoid URL encoding issues in the password.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-detectionforge}@db:5432/${POSTGRES_DB:-detectionforge}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ORIGINS: '[]'
      SPLUNK_FIELD_MAPPINGS: ${SPLUNK_FIELD_MAPPINGS:?Copy .env.example to .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
    mem_limit: 384m
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
volumes:
  postgres_data:
